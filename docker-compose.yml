version: "3.8"
services:
  sparkyfitness-mcp:
    image: sparkyfitness-mcp-server:latest
    container_name: sparkyfitness-mcp
    build: .
    restart: unless-stopped
    ports:
      - "${MCP_PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      # Database (app user — respects RLS)
      - SPARKY_FITNESS_DB_HOST=${SPARKY_FITNESS_DB_HOST}
      - SPARKY_FITNESS_DB_PORT=${SPARKY_FITNESS_DB_PORT:-5432}
      - SPARKY_FITNESS_DB_NAME=${SPARKY_FITNESS_DB_NAME}
      - SPARKY_FITNESS_DB_USER=${SPARKY_FITNESS_DB_USER}
      - SPARKY_FITNESS_DB_PASSWORD=${SPARKY_FITNESS_DB_PASSWORD}
      # Database (owner user — for migrations/DDL only)
      - SPARKY_FITNESS_DB_OWNER_USER=${SPARKY_FITNESS_DB_OWNER_USER}
      - SPARKY_FITNESS_DB_OWNER_PASSWORD=${SPARKY_FITNESS_DB_OWNER_PASSWORD}
      # OAuth
      - MCP_OAUTH_ISSUER=${MCP_OAUTH_ISSUER}
      - MCP_OAUTH_JWT_SECRET=${MCP_OAUTH_JWT_SECRET}
      # Vision API (optional)
      - VISION_API_KEY=${VISION_API_KEY:-}
      - VISION_API_PROVIDER=${VISION_API_PROVIDER:-gemini}
      # Dev tools (admin only)
      - DEV_TOOLS_ENABLED=${DEV_TOOLS_ENABLED:-false}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - sparkyfitness_internal

networks:
  sparkyfitness_internal:
    external: true
    name: sparkyfitness_internal
